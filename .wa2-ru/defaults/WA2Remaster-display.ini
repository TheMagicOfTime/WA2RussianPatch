; JP auto DPI: native Windows=system aware; Wine10=unaware (tested at100%).
; WA2 Remaster — настройки вывода на большие и широкие экраны.
; Файл читается при каждом запуске WA2_ru.exe. Сохраните его после правки
; и перезапустите игру. Неизвестные значения заменяются значениями по умолчанию.
;
; Mode
;   enhanced — кадр 16:9 выводится в реальном разрешении окна или экрана
;              без растяжения: на 3840×2160 на весь экран, на 3440×1440 —
;              2560×1440 по центру с чёрными полями по 440 пикселей.
;              Мышь пересчитывается для текущего размера окна.
;   original — прежний вывод игры без изменений (для сравнения и отката).
;
; HighDensityText
;   1 — реплики, имена говорящих и журнал (backlog) рисуются с плотностью
;       2× или 3× прямо на итоговом кадре: те же буквы, размер, переносы,
;       интервалы, цвета, обводка и появление текста; русский — профиль C30.
;       Включается, когда кадр увеличен больше чем в 1 раз (1920×1080 и выше).
;   0 — текст увеличивается вместе с кадром 1280×720, как в версии 0.3.0.
;   Меню, кнопки и субтитры к видео по-прежнему увеличиваются вместе с кадром.
;
; SceneFilter
;   linear — плавное увеличение кадра (по умолчанию, как у драйвера).
;   point  — увеличение «пикселями» без сглаживания.
;
; DpiAware
;   1 — игра получает настоящий размер основного экрана при масштабе Windows
;       125–300 % (SetProcessDPIAware);
;       без этого Windows растягивает уменьшенную картинку и полный экран
;       может открыться не в родном разрешении.
;   permonitor — то же для каждого монитора отдельно (per-monitor v2,
;       экспериментально; на настоящей Windows не проверено).
;   0 — прежнее поведение Windows для старых программ.
;
; Trace
;   0 — короткий журнал .wa2-ru\generated\display.log.
;   1 — подробный журнал каждого кадра (только для диагностики).

[Display]
Mode=enhanced
HighDensityText=1
SceneFilter=linear
DpiAware=auto
Trace=0
